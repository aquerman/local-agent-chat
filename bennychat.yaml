# BennyChat configuration: LibreChat wired to a local llama-server (aquerman/local-llm).
#
# This is the fork's tracked config. librechat.yaml stays git-ignored for machine-specific edits:
# either point LibreChat at this file (CONFIG_PATH=bennychat.yaml in .env) or copy it to
# librechat.yaml. Each section names the roadmap item it belongs to, so a feature can be found
# and switched off again in one place. Upstream's full reference is librechat.example.yaml.
version: 1.3.17

cache: true

# Roadmap 12, search past chats: upstream conversation search is switched on in .env, not here
# (SEARCH=true, MEILI_HOST=http://127.0.0.1:7700, MEILI_MASTER_KEY=<generated>), with Meilisearch
# started by scripts\start-all.bat from bin\meilisearch.exe. See CLAUDE.md, "Chat search".

interface:
  # Claude Desktop-style sidebar and composer (fork option, see CLAUDE.md "Minimal layout").
  layout: minimal
  # Roadmap 10 (skills): who may use and author Skills. Starter skills live in skill/ (read-only,
  # loaded at startup); users can add their own from the Skills panel.
  skills:
    use: true
    create: true

endpoints:
  # LibreChat's SSRF guard blocks loopback unless it is listed here as host:port.
  allowedAddresses:
    - '127.0.0.1:8080'
  custom:
    # local-llm's llama-server (../local-llm/scripts/start-server.ps1 serves it as model `local`).
    - name: 'Benner'
      apiKey: 'local' # llama-server ignores it, but it must not be empty
      baseURL: 'http://127.0.0.1:8080/v1'
      models:
        default: ['local']
        fetch: false
      modelDisplayLabel: 'local-llm'
      titleConvo: true
      titleModel: 'current_model'
      customParams:
        # Thinking pill -> llama-server's enable_thinking / thinking_budget_tokens (ADR 0001).
        reasoningFormat: 'llama_cpp_budget'
        thinkingBudgets:
          low: 512
          medium: 2048
          high: 6144

  # Roadmap 10 (skills): the model sees only a catalog of names + one-line descriptions and loads
  # a skill's body with the `skill` tool when it needs it. Cap the catalog so a 9B model's prompt
  # stays small (~40 tokens per skill). `skills` must stay in agents.capabilities (upstream default).
  agents:
    skills:
      maxCatalogSkills: 12

fileConfig:
  endpoints:
    custom:
      # llama-server rejects OpenAI `file` parts, so PDFs are parsed to text on upload.
      defaultLLMDeliveryPath:
        overrides:
          application/pdf: text

mcpServers:
  # Web search (packages/websearch): DuckDuckGo search + page fetch, attached to every chat.
  websearch:
    type: stdio
    command: node
    args: ['packages/websearch/dist/index.cjs']
    alwaysOn: true
    env:
      WEBSEARCH_MAX_CHARS: '20000'
      WEBSEARCH_TIMEOUT_MS: '15000'
      # Roadmap 2.1, JS rendering: a page whose static HTML has almost no text is re-read in
      # headless Edge/Chrome (auto | always | off). Leave the path empty to use the installed
      # Microsoft Edge on Windows; set it to a chrome.exe / msedge.exe to pick another browser.
      WEBSEARCH_RENDER: 'auto'
      WEBSEARCH_BROWSER_PATH: ''

# Artifacts offline (roadmap 5c): nothing to switch on in this file. Artifacts are enabled per chat
# from the Tools menu. For previews without the internet, set in .env:
#   SANDPACK_STATIC_BUNDLER_URL=http://preview.localhost:3080
# (port = PORT). See CLAUDE.md "Artifacts offline"; React previews still need codesandbox.io.
