# BennyChat configuration: LibreChat wired to a local llama-server (aquerman/local-llm).
#
# This is the fork's tracked config. librechat.yaml stays git-ignored for machine-specific edits:
# either point LibreChat at this file (CONFIG_PATH=bennychat.yaml in .env) or copy it to
# librechat.yaml. Each section names the roadmap item it belongs to, so a feature can be found
# and switched off again in one place. Upstream's full reference is librechat.example.yaml.
version: 1.3.17

cache: true

# Roadmap 12, search past chats: upstream conversation search is switched on in .env, not here
# (SEARCH=true, MEILI_HOST=http://127.0.0.1:7700, MEILI_MASTER_KEY=<generated>), with Meilisearch
# started by scripts\start-all.bat from bin\meilisearch.exe. See CLAUDE.md, "Chat search".

interface:
  # Claude Desktop-style sidebar and composer (fork option, see CLAUDE.md "Minimal layout").
  layout: minimal
  # Roadmap 10 (skills): who may use and author Skills. Starter skills live in skill/ (read-only,
  # loaded at startup); users can add their own from the Skills panel.
  skills:
    use: true
    create: true
  # Roadmap 3 (Routines): upstream's scheduled chats, shown in the UI as "Scheduled chats".
  # A schedule sends a prompt to an agent on a cadence and files each run as a new chat.
  # Needs SCHEDULES_SINGLE_PROCESS=true in .env (no Redis here). Upstream defaults except
  # fireConcurrency: one GPU slot, so scheduled runs go one at a time; a run that finds the
  # slot busy waits and retries instead of being dropped. See CLAUDE.md "Routines".
  schedules:
    use: true
    create: true
    maxPerUser: 10
    minIntervalMinutes: 60
    autoDisableAfterFailures: 5
    fireConcurrency: 1

endpoints:
  # LibreChat's SSRF guard blocks loopback unless it is listed here as host:port.
  allowedAddresses:
    - '127.0.0.1:8080'
  custom:
    # local-llm's llama-server (../local-llm/scripts/start-server.ps1 serves it as model `local`).
    - name: 'Benner'
      apiKey: 'local' # llama-server ignores it, but it must not be empty
      baseURL: 'http://127.0.0.1:8080/v1'
      models:
        default: ['local']
        fetch: false
      modelDisplayLabel: 'local-llm'
      titleConvo: true
      titleModel: 'current_model'
      customParams:
        # Thinking pill -> llama-server's enable_thinking / thinking_budget_tokens (ADR 0001).
        reasoningFormat: 'llama_cpp_budget'
        thinkingBudgets:
          low: 512
          medium: 2048
          high: 6144

  # --- F3: Agents endpoint on the local model -------------------------------------------------
  # Chats run through LibreChat's Agents endpoint with a default "Benny" agent (seeded by
  # `npm run seed-benny`, see the modelSpecs entry below). Sized for Qwen3.5-9B on one GPU slot.
  agents:
    # A graph step is one model call or one tool round. 20 allows about 8-9 tool calls per turn,
    # enough for search -> fetch -> answer chains without letting a looping 9B model spin long.
    recursionLimit: 20
    # Roadmap 16: raised from 50 so the Researcher agent's own recursion_limit (100, set by
    # `npm run seed-benny`) is not capped; Benny and other agents keep the default of 20.
    maxRecursionLimit: 100
    # No hosted Code API (execute_code), no keyed web_search (the websearch MCP covers it) and no
    # OCR service yet, so those three stay off. Everything else is upstream's default set.
    capabilities:
      - deferred_tools
      - file_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
    # Roadmap 10 (skills): the model sees only a catalog of names + one-line descriptions and loads
    # a skill's body with the `skill` tool when it needs it. Cap the catalog so a 9B model's prompt
    # stays small (~40 tokens per skill). `skills` must stay in capabilities above.
    skills:
      maxCatalogSkills: 12
    # --- 13: Approvals and ask-the-user ----------------------------------------------------------
    # Claude Desktop's default: read-only tools run without asking, anything that writes, sends
    # or deletes asks first, with Approve (once), "Always allow in this chat", Reject or Edit.
    # `mode: default` means every tool no `allow` pattern matches asks, so a new connector's write
    # tools are gated with no extra config. Do not list write tools under `ask`: an `ask` match
    # also overrides "Always allow in this chat". MCP tools are named `<tool>_mcp_<server>`.
    # The ask_user_question tool (agent capability above) never needs approval.
    toolApproval:
      enabled: true
      mode: default
      allow:
        - 'file_search'
        - 'tool_search'
        - 'skill'
        - 'read_file'
        - 'subagent'
        - 'search*_mcp_*'
        - 'fetch*_mcp_*'
        - 'get*_mcp_*'
        - 'list*_mcp_*'
        - 'read*_mcp_*'
        - 'find*_mcp_*'
        - 'view*_mcp_*'
        - 'query*_mcp_*'
        - 'describe*_mcp_*'
        # Roadmap 4: Todoist's one read tool without a read verb. Its writes (add-*, update-*,
        # complete-tasks, delete-object, ...) match nothing here, so they ask.
        - 'user-info_mcp_todoist'
        # Roadmap 5a: documents only renders a file into this chat (like Claude Desktop's file
        # creation), so create_document / append_section run without asking.
        - '*_mcp_documents'
        # Roadmap 8, folder access: the filesystem server's one read-only tool the patterns above
        # miss. Its write_file, edit_file, create_directory and move_file match nothing, so they ask.
        - 'directory_tree_mcp_filesystem'
      reason: 'Benny wants to run {tool}. It can change data outside this chat.'
    # Paused runs (approval or Ask User) wait up to a day in MongoDB, then expire.
    checkpointer:
      type: mongo
      ttl: 86400

fileConfig:
  endpoints:
    custom:
      # llama-server rejects OpenAI `file` parts, so PDFs are parsed to text on upload.
      defaultLLMDeliveryPath:
        overrides:
          application/pdf: text
      # R9 Knowledge and RAG (off until the RAG stack is installed, see CLAUDE.md "Knowledge and
      # RAG"). Uncommented, the attach button opens a chooser: Upload to Provider (images only
      # here: a PDF sent that way is refused by llama-server), Upload as Text, and Upload for File
      # Search once File Search is on in the tools menu. File Search embeds the file through the
      # local RAG API and each turn gets only the chunks matching the question, not the whole file.
      # Agents with File Search use the RAG API as soon as RAG_API_URL is set, without this line.
      # legacyFileUploadUX: true

mcpServers:
  # Web search (packages/websearch): DuckDuckGo search + page fetch, attached to every chat.
  websearch:
    type: stdio
    command: node
    args: ['packages/websearch/dist/index.cjs']
    alwaysOn: true
    env:
      WEBSEARCH_MAX_CHARS: '20000'
      WEBSEARCH_TIMEOUT_MS: '15000'
      # Roadmap 2.1, JS rendering: a page whose static HTML has almost no text is re-read in
      # headless Edge/Chrome (auto | always | off). Leave the path empty to use the installed
      # Microsoft Edge on Windows; set it to a chrome.exe / msedge.exe to pick another browser.
      WEBSEARCH_RENDER: 'auto'
      WEBSEARCH_BROWSER_PATH: ''

  # --- Roadmap 4, connectors: Todoist, calendar, email (docs/connectors.md) --------------------
  # Like Claude Desktop's connectors: nothing starts at boot (`startup: false`), each user connects
  # their own account from the MCP panel (Todoist by OAuth in the browser, calendar and email by
  # filling in per-user settings, stored encrypted in MongoDB, never in .env or git). Pick a
  # connector per chat in the MCP selector, or add it to an agent. Read tools run freely; writes
  # ask first through `endpoints.agents.toolApproval` (roadmap 13), which asks for every tool its
  # `allow` list does not name. Calendar and email have no write tools at all.
  todoist:
    title: 'Todoist'
    description: 'Your Todoist tasks and projects (official Todoist MCP server, sign in with OAuth)'
    type: streamable-http
    url: 'https://ai.todoist.net/mcp'
    requiresOAuth: true
    startup: false
    # Todoist's server registers LibreChat as an OAuth client on first connect (dynamic client
    # registration) and redirects back to <DOMAIN_SERVER>/api/mcp/todoist/oauth/callback.
    timeout: 60000
  calendar:
    title: 'Calendar'
    description: 'Read-only: your calendar events from a private iCal (ICS) address'
    type: stdio
    command: node
    args: ['packages/calendar/dist/index.cjs']
    startup: false
    customUserVars:
      CALENDAR_ICS_URL:
        title: 'Calendar address (ICS)'
        description: 'The secret iCal address of your calendar (Google: calendar settings, "Secret address in iCal format"; Outlook: Settings, Shared calendars, Publish). Several: separate with |'
        sensitive: true
    env:
      CALENDAR_ICS_URL: '{{CALENDAR_ICS_URL}}'
      # Empty = Windows' own time zone. Set an IANA name (e.g. Europe/Amsterdam) to override.
      CALENDAR_TIMEZONE: ''
      CALENDAR_CACHE_SECONDS: '300'
  email:
    title: 'Email'
    description: 'Read-only: search and read your mailbox over IMAP (no sending)'
    type: stdio
    command: node
    args: ['packages/email/dist/index.cjs']
    startup: false
    customUserVars:
      EMAIL_IMAP_HOST:
        title: 'IMAP server'
        description: 'For example imap.gmail.com or imap.fastmail.com (port 993, TLS)'
        sensitive: false
      EMAIL_USER:
        title: 'User name'
        description: 'Usually your full email address'
        sensitive: false
      EMAIL_PASSWORD:
        title: 'App password'
        description: 'An app-specific password (Gmail: Google account, Security, App passwords), not your normal password'
        sensitive: true
    env:
      EMAIL_IMAP_HOST: '{{EMAIL_IMAP_HOST}}'
      EMAIL_USER: '{{EMAIL_USER}}'
      EMAIL_PASSWORD: '{{EMAIL_PASSWORD}}'
      # Empty = port 993 with TLS (Gmail, Fastmail, iCloud and most providers).
      EMAIL_IMAP_PORT: ''
      EMAIL_IMAP_SECURE: ''
      EMAIL_MAX_CHARS: '4000'

  # Roadmap 5a, documents (packages/documents): create_document / append_section render Word,
  # PDF and PowerPoint files from Markdown or a slide outline in a built-in house style.
  # `fileOutputs: true` (fork MCP option) turns the returned files into chat attachments.
  # PDF printing uses the installed Microsoft Edge on Windows (nothing is downloaded); set
  # DOCUMENTS_BROWSER_PATH to use another Chromium-based browser.
  documents:
    type: stdio
    command: node
    args: ['packages/documents/dist/index.cjs']
    alwaysOn: true
    fileOutputs: true
    env:
      DOCUMENTS_PAGE_SIZE: 'A4'

  # Roadmap 8, folder access: the reference filesystem MCP server
  # (@modelcontextprotocol/server-filesystem, pinned in packages/folders, so nothing is downloaded at
  # start) on the folders listed in BENNY_FOLDERS in .env, separated by ';' on Windows, for example
  # BENNY_FOLDERS=%USERPROFILE%\Documents\Assistant;%USERPROFILE%\Notes. Unset, it serves
  # <home>\Documents\Assistant (created if missing). Paths outside those folders are refused.
  # Benny carries 9 of its 14 tools (config/seed-benny.js). Not alwaysOn: other chats pick "Folders"
  # from the MCP selector, so its schemas stay out of chats that do not use them. Writes ask first
  # (endpoints.agents.toolApproval above: reads match its allow list, the four write tools nothing).
  filesystem:
    type: stdio
    title: 'Folders'
    description: 'Read and search your folders; edits ask first'
    command: node
    args: ['packages/folders/src/index.mjs']
    env:
      BENNY_FOLDERS: '${BENNY_FOLDERS}'
    serverInstructions: >-
      Folder tools only reach the user's allowed folders (list_allowed_directories shows them).
      Find files with search_files or list_directory, not directory_tree on big folders. Read long
      files in parts with read_text_file head or tail. Writes ask the user for approval.

# Artifacts offline (roadmap 5c): nothing to switch on in this file. Artifacts are enabled per chat
# from the Tools menu. For previews without the internet, set in .env:
#   SANDPACK_STATIC_BUNDLER_URL=http://preview.localhost:3080
# (port = PORT). See CLAUDE.md "Artifacts offline"; React previews still need codesandbox.io.

# Roadmap 7: Memory. Upstream's memory agent extracts durable facts after each user turn and
# every chat sees them in its system prompt; the user views/edits/deletes them under
# Customize > Memories. The agent is a second, non-streaming request to llama-server that
# starts alongside the reply (upstream has no "after the reply" mode). llama-server's default
# --parallel auto gives 4 slots, so it runs beside the reply instead of in front of it; the cost
# is its prompt (~700 tokens) prefilled next to the reply's. Keep the window and limits small.

memory:
  personalize: true # per-user "Use memory" switch in Customize > Memories
  tokenLimit: 1500 # total across all keys; ~1k-token slice of the turn budget
  messageWindowSize: 3 # last user turn plus the exchange before it
  maxInputTokens: 2000 # cap on the chat excerpt sent to the memory agent
  validKeys: ['about_user', 'preferences', 'projects', 'instructions']
  agent:
    enabled: true
    provider: 'Benner'
    model: 'local'
    model_parameters:
      reasoning_effort: 'none' # -> chat_template_kwargs.enable_thinking: false (ADR 0001)
      temperature: 0.2
      max_tokens: 400
    instructions: |
      You maintain a short memory about the user that is shown to the assistant in every future chat.
      Read the chat excerpt and decide whether the USER revealed anything worth remembering long term:
      - about_user: stable facts (name, job, location, languages, tools they use, family, pets)
      - preferences: how they like answers (tone, length, format, units, language) and likes/dislikes
      - projects: what they are working on now and its current state
      - instructions: standing rules they gave you ("always...", "never...", "from now on...")
      Use the key that fits: how they like answers is preferences, not about_user.
      Each key holds ONE value and set_memory replaces it. To add a fact, call set_memory with the key
      and a value that keeps every still-true fact already stored under that key plus the new one,
      as short third-person sentences ("The user ..."). Remove a fact the user corrects or asks you to forget; use delete_memory
      only to clear a whole key.
      Save only what the user said about themselves, not facts about the world, small talk, or
      one-off requests. Never save passwords, secrets or health details unless asked to.
      If nothing new is worth keeping, do not call any tool and reply with the single word: none.

# Roadmap 11, voice: dictation (STT) and read-aloud (TTS) through local servers on the CPU, so the
# GPU stays with the LLM. Setup and launcher: docs/voice.md. Ports must match VOICE_STT_PORT /
# VOICE_TTS_PORT in .env (defaults 8082 / 8083), which scripts\start-all.bat uses.
speech:
  stt:
    # whisper.cpp's whisper-server, started with --inference-path /v1/audio/transcriptions and
    # --convert (ffmpeg turns the browser's webm/ogg/mp4 recording into WAV). `model` is ignored.
    openai:
      url: 'http://127.0.0.1:8082/v1/audio/transcriptions'
      apiKey: 'local' # ignored by the server, but the schema requires one
      model: 'whisper-1'
    # The speech SSRF guard blocks loopback unless the host:port is listed here.
    allowedAddresses:
      - '127.0.0.1:8082'
  tts:
    # packages/piper: an OpenAI /v1/audio/speech server in front of Piper (mp3 via ffmpeg).
    # `auto` reads Dutch text with the installed nl_* voice and English with the en_* voice.
    # Named voices must be installed in bin\piper\voices; an unknown name falls back to `auto`.
    openai:
      url: 'http://127.0.0.1:8083/v1/audio/speech'
      apiKey: 'local'
      model: 'piper'
      voices: ['auto', 'nl_NL-mls-medium', 'en_US-lessac-medium']
    allowedAddresses:
      - '127.0.0.1:8083'
  # Defaults for Settings > Speech, applied until a user changes them (then localStorage wins).
  # Mirrors Claude's dictation: click the mic, speak, click it again; the text lands in the composer
  # and you press send yourself (no 3 s silence auto-stop, no auto-send). Replies are read aloud
  # only from a message's speaker button, never automatically.
  speechTab:
    conversationMode: false
    advancedMode: false
    speechToText:
      engineSTT: 'external'
      languageSTT: '' # empty = whisper detects Dutch or English per recording
      autoTranscribeAudio: false
      decibelValue: -45
      autoSendText: -1
    textToSpeech:
      engineTTS: 'external'
      voice: 'auto'
      automaticPlayback: false
      playbackRate: 1
      cacheTTS: true

# --- F3: context summarization -----------------------------------------------------------------
# When a conversation outgrows the agent's context budget (32k by default for model `local`,
# matching the roadmap's "typical turn in 32k"), older turns are summarized by the same local
# model instead of being dropped. No provider/model here = the agent's own (Benner / local).
summarization:
  enabled: true
  maxSummaryTokens: 1024
  retainRecent:
    turns: 2

# --- F3: default model spec --------------------------------------------------------------------
# New chats open on the Benny agent. The plain `Benner` endpoint stays in the model selector.
# The agent is a database record: create it once with `npm run seed-benny` (idempotent).
modelSpecs:
  list:
    - name: 'benny'
      label: 'Benny'
      description: 'Local assistant with web search, approvals and questions'
      default: true
      preset:
        endpoint: 'agents'
        agent_id: 'agent_benny'
    # Roadmap 16, deep research: like Claude's Research mode, pick "Researcher" in the model
    # selector. It shows a plan, reads web sources one sub-question at a time, notes them in the
    # chat and writes a cited report document (PDF by default). Seeded by `npm run seed-benny`;
    # its workflow is skill/deep-research/SKILL.md, which Benny can also use for a short run.
    - name: 'researcher'
      label: 'Researcher'
      description: 'Deep research: a plan, web sources, and a cited report document'
      preset:
        endpoint: 'agents'
        agent_id: 'agent_researcher'



# Roadmap P1a (projects): a chat project's instructions and knowledge files go into the system
# prompt of every chat in that project, after the agent's own instructions and before anything
# that changes per turn, so llama-server keeps reusing its cached prompt prefix. Edit them on the
# project's page (Projects in the sidebar). Knowledge whose extracted text fits this many tokens
# (estimated at 4 characters per token) is read in full; past it, chats get as much as fits, file
# by file, and the rest is named as left out. See CLAUDE.md "Projects".
projects:
  knowledgeInlineTokens: 6000
